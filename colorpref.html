<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SVG High Contrast Test</title>

<style>

body {
  font-family: Arial, sans-serif;
  padding: 40px;
}

/* Normal logo */
.logo-normal {
  width: 200px;
}

/* Logo where browser is allowed to change colors */
.logo-auto {
  width: 200px;
}

/* Logo that preserves original colors */
.logo-fixed {
  width: 200px;
  forced-color-adjust: none;
}

/* Styling when forced colors are active */
@media (forced-colors: active) {

  body {
    background: Canvas;
    color: CanvasText;
  }

  .test-box {
    border: 2px solid CanvasText;
  }

}

.test-box {
  margin-bottom: 40px;
}

</style>
</head>

<body>

<h1>SVG Accessibility Test – Forced Colors</h1>

<p>Enable Windows High Contrast Mode or simulate forced colors to see how SVG logos react.</p>

<div class="test-box">

<h2>Normal SVG (browser can adjust colors)</h2>

<svg class="logo-auto" viewBox="0 0 200 60" role="img" aria-label="Test Bank">
  <rect width="200" height="60" fill="#E3000F"></rect>
  <text x="100" y="38" text-anchor="middle" fill="white" font-size="22" font-weight="bold">
    BANK Logo
  </text>
</svg>

</div>


<div class="test-box">

<h2>SVG with forced-color-adjust: none</h2>

<svg class="logo-fixed" viewBox="0 0 200 60" role="img" aria-label="Test Bank">
  <rect width="200" height="60" fill="#E3000F"></rect>
  <text x="100" y="38" text-anchor="middle" fill="white" font-size="22" font-weight="bold">
    BANK Logo
  </text>
</svg>

</div>


<div class="test-box">

<h2>SVG using system colors (best compatibility)</h2>

<svg class="logo-normal" viewBox="0 0 200 60" role="img" aria-label="Test Bank">
  <rect width="200" height="60" fill="CanvasText"></rect>
  <text x="100" y="38" text-anchor="middle" fill="Canvas" font-size="22" font-weight="bold">
    BANK Logo
  </text>
</svg>

</div>

<div class="logo-wrap">
    <svg xmlns="http://www.w3.org/2000/svg"
         width="216"
         height="105"
         viewBox="0 0 216 105"
         role="img"
         aria-labelledby="title desc">
      <title id="title">uTest logo</title>
      <desc id="desc">Adaptive SVG logo that responds to user preference changes, including forced colors and high contrast settings.</desc>

      <style>
        :root {
          --accent: #19B5E6;
          --text: currentColor;
          --small: currentColor;
        }

        svg {
          color: #ffffff;
          background: transparent;
          forced-color-adjust: auto;
          font-family: Arial, Helvetica, sans-serif;
        }

        .mark {
          fill: var(--accent);
        }

        .u {
          fill: #ffffff;
          font-size: 36px;
          font-weight: 700;
        }

        .test {
          fill: var(--text);
          font-size: 58px;
          font-weight: 400;
          letter-spacing: -1px;
        }

        .reg {
          fill: var(--small);
          font-size: 12px;
          font-weight: 400;
        }

        @media (forced-colors: active) {
          svg {
            color: CanvasText;
          }

          .mark {
            fill: ButtonText;
            stroke: CanvasText;
            stroke-width: 1;
          }

          .u {
            fill: Canvas;
          }

          .test,
          .reg {
            fill: CanvasText;
          }
        }

        @media (prefers-contrast: more) {
          .mark {
            stroke: currentColor;
            stroke-width: 1.5;
          }

          .test {
            font-weight: 700;
          }
        }
      </style>

      <circle class="mark" cx="47" cy="52.5" r="28" />
      <text class="u" x="47" y="65" text-anchor="middle">u</text>
      <text class="test" x="82" y="71">Test</text>
      <text class="reg" x="177" y="34">®</text>
    </svg>
  </div>

</body>
</html>
